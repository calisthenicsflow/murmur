<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFEDEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Murmur">
<meta name="description" content="Murmur — read and listen. Neural voices, word-by-word highlight, focus and bilingual modes.">
<title>Murmur — read &amp; listen</title>
<link rel="canonical" href="https://calisthenicsflow.github.io/murmur/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Murmur">
<meta property="og:title" content="Murmur — read &amp; listen">
<meta property="og:description" content="Read and listen to any text: neural voices in 75 languages, word-by-word highlight, focus and bilingual modes. Free, private, works offline.">
<meta property="og:url" content="https://calisthenicsflow.github.io/murmur/">
<meta property="og:image" content="https://calisthenicsflow.github.io/murmur/icons/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://calisthenicsflow.github.io/murmur/icons/og.png">
<link rel="manifest" href="manifest.webmanifest?v=1.3.2">
<link rel="icon" href="favicon.ico?v=1.3.2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=1.3.2">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=1.3.2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=1.3.2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap&subset=cyrillic">
<link rel="stylesheet" href="css/app.css?v=1.3.2">
</head>
<body data-theme="paper">
<div id="dim"></div>
<main id="app">

  <!-- LIBRARY -->
  <section id="library" class="screen active" aria-label="Library">
    <div class="lib-scroll">
      <header class="lib-top">
        <div class="brand">murmur<i></i></div>
        <div class="top-actions">
          <button class="ghost-btn" id="btnStats" aria-label="Stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg></button>
          <button class="ghost-btn" id="btnQuotes" aria-label="Quotes"><svg viewBox="0 0 24 24"><path d="M9.5 6.5C6.6 7.6 5 9.8 5 13v4.5h5V13H7.4c.2-1.9 1.2-3.2 3-4M18.5 6.5c-2.9 1.1-4.5 3.3-4.5 6.5v4.5h5V13h-2.6c.2-1.9 1.2-3.2 3-4"/></svg></button>
          <button class="ghost-btn" id="btnAbout" aria-label="About"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 7.8v.01"/></svg></button>
          <button class="lang-pill" id="btnLang" aria-label="Interface language">EN</button>
        </div>
      </header>
      <h1 class="lib-title"><span class="kicker" data-i="myFav">My Favourite</span><span class="big" data-i="books">Books</span></h1>
      <div id="continue"></div>
      <div id="shelves"></div>
      <div class="lib-spacer"></div>
    </div>
    <div class="lib-dock"><button class="pill-black add-btn" id="btnAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i="addBooks">Add Books</span></button></div>
  </section>

  <!-- READER -->
  <section id="reader" class="screen" aria-label="Reader">
    <header class="rd-bar">
      <button class="round-btn" id="rdBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="rd-nav" id="rdNav" aria-label="Contents"><span class="rd-mini" id="rdMini"></span><span class="rd-nav-m"><span id="rdNavPct"></span><i class="rd-nav-bar"><b id="rdNavBar"></b></i></span></button>
      <button class="round-btn" id="rdMark" aria-label="Bookmark"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.6L7 20z"/></svg></button>
      <button class="round-btn" id="rdMore" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg></button>
      <button class="round-btn chrome-btn" id="rdChrome" aria-label="Hide controls" aria-pressed="false"><svg class="i-hide" viewBox="0 0 24 24"><path d="M3 12s3.3-6 9-6c1.3 0 2.5.3 3.5.8M21 12s-1.2 2.2-3.5 3.9M9.9 17.7c.7.2 1.4.3 2.1.3 5.7 0 9-6 9-6M3 12s1 1.8 2.9 3.4M4 20L20 4"/></svg><svg class="i-show" viewBox="0 0 24 24"><path d="M3 12s3.3-6 9-6 9 6 9 6-3.3 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
    </header>
    <div class="ocr-pill" id="ocrPill"><div class="ocr-bar"><i></i></div><span></span><button aria-label="Cancel"></button></div>
    <div class="rd-scroll" id="rdScroll">
      <div class="hl" id="hl"></div>
      <div class="rd-flow" id="rdFlow">
        <div class="rd-head" id="rdHead"><div class="rd-label" id="rdLabel"></div><h2 class="rd-title" id="rdTitle"></h2><div class="rd-orn"><i></i><b></b><i></i></div></div>
        <article class="rd-text" id="rdText"></article>
        <div class="rd-next" id="rdNext"></div>
      </div>
    </div>
    <button class="recenter" id="recenter"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span></span></button>
    <div class="rd-fade"></div>
    <div class="thin-prog" id="thinProg"><i></i></div>
    <div class="focus" id="focus"><div class="f-prog" id="fProg"></div><div class="f-stage" id="fStage"></div><button class="round-btn f-close" id="fClose" aria-label="Close focus"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="player" id="player">
      <div class="p-chips">
        <button class="chip" id="pVoice"><span class="dot"></span><span class="v"></span><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
        <button class="chip" id="pSpeed">1.0×</button>
        <button class="chip toggle" id="pFocus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 9V5a2 2 0 0 1 2-2h4M15 3h4a2 2 0 0 1 2 2v4M21 15v4a2 2 0 0 1-2 2h-4M9 21H5a2 2 0 0 1-2-2v-4"/></svg></button>
        <button class="chip toggle" id="pBi"><svg viewBox="0 0 24 24"><path d="M4 6h9M8.5 4v2M6 6c.5 3 2.5 5.5 5 6.5M11 6c-.7 3.3-3 6-6.5 7.5M13 20l4-9 4 9M14.4 17h5.2"/></svg></button>
      </div>
      <div class="p-prog"><div class="bar"><i id="pBar"></i></div><div class="p-meta"><span id="pPos"></span><span id="pLeft"></span></div></div>
      <div class="p-ctrl">
        <button class="ctl" id="pPrev" aria-label="Previous sentence"><svg viewBox="0 0 24 24"><path d="M11 7l-5 5 5 5M18 7l-5 5 5 5"/></svg></button>
        <button class="play" id="pPlay" aria-label="Play"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.3"/><rect x="13.5" y="5" width="4" height="14" rx="1.3"/></svg><span class="spin"></span></button>
        <button class="ctl" id="pNext" aria-label="Next sentence"><svg viewBox="0 0 24 24"><path d="M13 7l5 5-5 5M6 7l5 5-5 5"/></svg></button>
      </div>
    </div>
    <nav class="dock" id="dock">
      <button class="pill-black timer" id="dTimer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.2 1.6M9.5 2.8h5"/></svg><span id="dTimerTxt">Timer</span></button>
      <div class="seg" id="dSeg"><i class="knob"></i><button data-mode="read" class="on" data-i="read">Read</button><button data-mode="listen" data-i="listen">Listen</button></div>
      <button class="circle-black" id="dBright" aria-label="Brightness and theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
      <button class="circle-black aa" id="dFont" aria-label="Text settings">Aa</button>
    </nav>
  </section>

  <!-- QUOTES -->
  <section id="quotes" class="screen" aria-label="Quotes">
    <header class="sub-top"><button class="round-btn" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></header>
    <div class="sub-scroll"><h1 class="sub-title" data-i="quotes">Quotes</h1><div id="quoteList"></div></div>
  </section>

  <!-- STATS -->
  <section id="stats" class="screen" aria-label="Stats">
    <header class="sub-top"><button class="round-btn" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></header>
    <div class="sub-scroll"><h1 class="sub-title" data-i="stats">Your reading</h1><div id="statsBody"></div></div>
  </section>
</main>

<div id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-body" id="sheetBody"></div></div>
<div class="pop" id="pop"></div>
<div class="toast" id="toast"></div>
<div class="coach" id="coach" role="status"></div>
<script type="module" src="js/app.js?v=1.3.2"></script>
</body>
</html>
