<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Murmur">
<meta name="description" content="Murmur — read and listen. Neural voices, word-by-word highlight, focus and bilingual modes.">
<title>Murmur — read &amp; listen</title>
<link rel="canonical" href="https://calisthenicsflow.github.io/murmur/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Murmur">
<meta property="og:title" content="Murmur — read &amp; listen">
<meta property="og:description" content="Read and listen to any text: neural voices in 75 languages, word-by-word highlight, focus and bilingual modes. Free, private, works offline.">
<meta property="og:url" content="https://calisthenicsflow.github.io/murmur/">
<meta property="og:image" content="https://calisthenicsflow.github.io/murmur/icons/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://calisthenicsflow.github.io/murmur/icons/og.png">
<link rel="manifest" href="manifest.webmanifest?v=1.7.1">
<link rel="icon" href="favicon.ico?v=1.7.1" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=1.7.1">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=1.7.1">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=1.7.1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap&subset=cyrillic">
<link rel="stylesheet" href="css/app.css?v=1.7.1">
<link rel="stylesheet" href="css/studio.css?v=1.7.1">
<link rel="stylesheet" href="css/flat.css?v=1.7.1">
</head>
<body data-theme="paper">
<div id="dim"></div>
<main id="app">

  <!-- LIBRARY -->
  <section id="library" class="screen active" aria-label="Library">
    <div class="lib-scroll">
      <header class="lib-top">
        <div class="brand">murmur<i></i></div>
        <div class="top-actions">
          <button class="ghost-btn" id="btnStats" aria-label="Stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg></button>
          <button class="ghost-btn" id="btnQuotes" aria-label="Quotes"><svg viewBox="0 0 24 24"><path d="M4.5 5.5h15v10h-9l-5 3.6V15.5h-1z"/></svg></button>
          <button class="ghost-btn" id="btnAdd" aria-label="Add Books"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="ghost-btn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
          <span hidden><button id="btnAbout"></button><button class="lang-pill" id="btnLang">EN</button></span>
        </div>
      </header>
      <div class="lib-greet" id="libGreet"></div>
      <h1 class="lib-h1" id="libH1"></h1>
      <div id="continue"></div>
      <div id="shelves"></div>
      <div class="lib-spacer"></div>
    </div>
    <button class="orb orb-mini" id="libOrb" aria-label="Listen"><svg viewBox="0 0 30 24"><rect x="1" y="8" width="4" height="8" rx="2"/><rect x="9" y="2" width="4" height="20" rx="2"/><rect x="17" y="5" width="4" height="14" rx="2"/><rect x="25" y="9" width="4" height="6" rx="2"/></svg></button>
  </section>

  <!-- READER -->
  <section id="reader" class="screen" aria-label="Reader">
    <header class="rd-bar">
      <button class="round-btn" id="rdBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="rd-nav" id="rdNav" aria-label="Contents"><span class="rd-mini" id="rdMini"></span><span class="rd-nav-m"><span id="rdSub"></span></span></button>
      <span class="rd-bar-sp" aria-hidden="true"></span>
    </header>
    <div class="ocr-pill" id="ocrPill"><div class="ocr-bar"><i></i></div><span></span><button aria-label="Cancel"></button></div>
    <div class="rd-scroll" id="rdScroll">
      <div class="hls" id="hls"><div class="hl" id="hl"></div></div>
      <div class="sels" id="sels"></div>
      <div class="sel-handle a" id="selA" hidden></div>
      <div class="sel-handle b" id="selB" hidden></div>
      <div class="rd-flow" id="rdFlow">
        <div class="rd-head" id="rdHead"><div class="rd-label" id="rdLabel"></div><h2 class="rd-title" id="rdTitle"></h2><div class="rd-orn"><i></i><b></b><i></i></div></div>
        <article class="rd-text" id="rdText"></article>
        <div class="rd-next" id="rdNext"></div>
      </div>
    </div>
    <button class="recenter" id="recenter" aria-label="Back to current word"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v13.5M6.5 12.5L12 18l5.5-5.5"/></svg></button>
        <div class="thin-prog" id="thinProg"><i></i></div>
    <div class="focus" id="focus"><div class="f-prog" id="fProg"></div><div class="f-stage" id="fStage"></div><button class="round-btn f-close" id="fClose" aria-label="Close focus"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="cap" id="dock" data-st="read" aria-label="Player">
      <div class="cap-bg" id="capBg"></div>
      <div class="cseg" id="dSeg" role="tablist"><i class="knob" id="segKnob"></i><button data-mode="read" class="on" role="tab" aria-label="Read"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7.5 4.5 4 4.5v13c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2v-13c-3.5 0-6 .5-8 2zM12 6.5v13"/></svg></button><button data-mode="listen" role="tab" aria-label="Listen"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3.5" y="14" width="4" height="6" rx="1.6"/><rect x="16.5" y="14" width="4" height="6" rx="1.6"/></svg></button></div>
      <div class="cp cp-read">
        <div class="c-info"><b id="cInfoT" data-i="readingT">Reading</b><span id="cInfoS"></span></div>
        <button class="cbtn aa" id="dFont" aria-label="Text">Aa</button>
        <button class="cbtn" id="rdMore" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg></button>
      </div>
      <div class="cp cp-listen">
        <div class="c-tr">
          <button class="ctb" id="pPrev" aria-label="Previous sentence" style="--i:0"><svg viewBox="0 0 24 24"><path d="M11 7l-5 5 5 5M18 7l-5 5 5 5"/></svg></button>
          <button class="play" id="pPlay" aria-label="Play" style="--i:1"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.3"/><rect x="13.5" y="5" width="4" height="14" rx="1.3"/></svg><span class="spin"></span></button>
          <button class="ctb" id="pNext" aria-label="Next sentence" style="--i:2"><svg viewBox="0 0 24 24"><path d="M13 7l5 5-5 5M6 7l5 5-5 5"/></svg></button>
        </div>
        <button class="cspd" id="pSpeed" aria-label="Speed" style="--i:3">1.0×</button>
        <button class="ctb tmr" id="dTimer" aria-label="Sleep timer" style="--i:4"><svg viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg><span class="vh" id="dTimerTxt"></span></button>
      </div>
      <div class="cp cp-speed">
        <div class="spd" id="spd" role="slider" aria-label="Speed" aria-valuemin="0.75" aria-valuemax="3" tabindex="0"><i class="spd-tr"></i><i class="spd-fl" id="spdFl"></i><div class="spd-tk" id="spdTk"></div><div class="spd-kn" id="spdKn"><span id="spdV">1.0×</span></div></div>
      </div>
      <div class="spd-nums" id="spdNums" aria-hidden="true"></div>
    </nav>
    <label class="hapt" aria-hidden="true"><input type="checkbox" switch tabindex="-1" id="haptIn"></label>
  </section>

  <!-- QUOTES -->
  <section id="quotes" class="screen" aria-label="Quotes">
    <header class="sub-top"><button class="round-btn" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></header>
    <div class="sub-scroll"><h1 class="sub-title" data-i="myQuotes">My quotes</h1><div id="quoteList"></div></div>
  </section>

  <!-- STATS -->
  <section id="stats" class="screen" aria-label="Stats">
    <header class="sub-top"><button class="round-btn" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></header>
    <div class="sub-scroll"><h1 class="sub-title" data-i="stats">Your reading</h1><div id="statsBody"></div></div>
  </section>
</main>

<div id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-body" id="sheetBody"></div></div>
<div class="pop" id="pop"></div>
<div class="toast" id="toast"></div>
<div class="coach" id="coach" role="status"></div>
<script type="module" src="js/app.js?v=1.7.1"></script>
</body>
</html>
